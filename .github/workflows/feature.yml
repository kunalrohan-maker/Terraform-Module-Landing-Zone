name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================

  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    env:
      AZURE_CONFIG_DIR: ${{ runner.temp }}\azure-cli-clean

    defaults:
      run:
        shell: cmd

    steps:

      # --------------------------------------------------------
      # Prepare fresh Azure CLI configuration
      # --------------------------------------------------------

      - name: Prepare Azure CLI Config
        run: |
          if exist "%AZURE_CONFIG_DIR%" rmdir /s /q "%AZURE_CONFIG_DIR%"
          mkdir "%AZURE_CONFIG_DIR%"

      # --------------------------------------------------------
      # Checkout Feature Branch
      # --------------------------------------------------------

      - name: Checkout Feature Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Terraform Version
      # Terraform is already installed on the self-hosted runner
      # --------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ==========================================================
  # 2. CREATE PR + AUTOMATIC MERGE
  #    feature -> main
  # ==========================================================

  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    needs:
      - terraform-ci

    if: success()

    steps:

      # --------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Create Pull Request
      # --------------------------------------------------------

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Repository: ${owner}/${repo}`);
            core.info(`Creating/checking PR: feature -> main`);

            // Check if an open PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (existingPRs.data.length > 0) {
              const prNumber = existingPRs.data[0].number;

              core.info(`Existing PR found: #${prNumber}`);
              core.setOutput("pr_number", prNumber.toString());
              return;
            }

            // Create PR body
            const prBody = [
              "## Terraform CI Passed",
              "",
              "The Terraform CI pipeline completed successfully.",
              "",
              "### Checks completed",
              "- Terraform Init",
              "- Terraform Format",
              "- Terraform Validate",
              "- Terraform Plan",
              "",
              "This Pull Request was created automatically by GitHub Actions."
            ].join("\n");

            // Create Pull Request
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: "Feature to Main - Terraform CI Passed",
              head: "feature",
              base: "main",
              body: prBody
            });

            core.info(`Pull Request created: #${pr.data.number}`);
            core.setOutput("pr_number", pr.data.number.toString());


      # --------------------------------------------------------
      # Wait until GitHub calculates PR mergeability
      # --------------------------------------------------------

      - name: Check Pull Request Mergeability
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (prs.data.length === 0) {
              core.setFailed("No open Pull Request found.");
              return;
            }

            const prNumber = prs.data[0].number;

            core.info(`Checking PR #${prNumber}`);

            for (let attempt = 1; attempt <= 12; attempt++) {

              const pr = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });

              core.info(
                `Attempt ${attempt}: mergeable=${pr.data.mergeable}, state=${pr.data.mergeable_state}`
              );

              if (pr.data.mergeable === true) {
                core.info("PR is mergeable.");
                return;
              }

              if (pr.data.mergeable === false) {
                core.setFailed(
                  `PR is not mergeable. GitHub state: ${pr.data.mergeable_state}`
                );
                return;
              }

              // GitHub may temporarily return null
              // while calculating mergeability.
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            core.setFailed(
              "GitHub did not determine PR mergeability within the expected time."
            );


      # --------------------------------------------------------
      # Merge Pull Request
      # --------------------------------------------------------

      - name: Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (prs.data.length === 0) {
              core.setFailed(
                "No open Pull Request found from feature to main."
              );
              return;
            }

            const prNumber = prs.data[0].number;

            core.info(`Merging PR #${prNumber}`);

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "merge",
              commit_title: "Merge feature into main",
              commit_message:
                "Automatically merged after successful Terraform CI."
            });

            if (!result.data.merged) {
              core.setFailed(
                `PR #${prNumber} was not merged. Message: ${result.data.message}`
              );
              return;
            }

            core.info(
              `PR #${prNumber} merged successfully. SHA: ${result.data.sha}`
            );


  # ==========================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================================

  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    needs:
      - merge-feature-to-main

    if: success()

    env:
      AZURE_CONFIG_DIR: ${{ runner.temp }}\azure-cli-clean

    defaults:
      run:
        shell: cmd

    steps:

      # --------------------------------------------------------
      # Prepare fresh Azure CLI configuration
      # --------------------------------------------------------

      - name: Prepare Azure CLI Config
        run: |
          if exist "%AZURE_CONFIG_DIR%" rmdir /s /q "%AZURE_CONFIG_DIR%"
          mkdir "%AZURE_CONFIG_DIR%"

      # --------------------------------------------------------
      # Checkout Main
      # --------------------------------------------------------

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # --------------------------------------------------------
      # Verify Main Branch
      # --------------------------------------------------------

      - name: Verify Main Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      # --------------------------------------------------------
      # Terraform Version
      # --------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      # --------------------------------------------------------
      # Deployment Complete
      # --------------------------------------------------------

      - name: Deployment Complete
        run: |
          echo ==========================================
          echo Terraform CD Completed Successfully
          echo Feature -^> Main -^> Azure
          echo ==========================================