name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================

  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:

      # --------------------------------------------------------
      # Checkout Feature Branch
      # --------------------------------------------------------

      - name: Checkout Feature Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Terraform Version
      # Terraform is already installed on self-hosted runner
      # --------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ==========================================================
  # 2. CREATE PR + AUTOMATIC MERGE
  #    feature -> main
  # ==========================================================

  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    needs:
      - terraform-ci

    if: success()

    steps:

      # --------------------------------------------------------
      # Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Create Pull Request
      # --------------------------------------------------------

      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            core.info(`Repository: ${owner}/${repo}`);
            core.info(`Source: feature`);
            core.info(`Target: main`);

            // Check whether an open PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (existingPRs.data.length > 0) {
              const prNumber = existingPRs.data[0].number;

              core.info(`Existing PR found: #${prNumber}`);

              core.setOutput("pr_number", prNumber.toString());
              return;
            }

            // Create PR
            const prBody = [
              "## Terraform CI Passed",
              "",
              "The Terraform CI pipeline completed successfully.",
              "",
              "### Checks completed",
              "- Terraform Init",
              "- Terraform Format",
              "- Terraform Validate",
              "- Terraform Plan",
              "",
              "This Pull Request was created automatically by GitHub Actions."
            ].join("\n");

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: "Feature to Main - Terraform CI Passed",
              head: "feature",
              base: "main",
              body: prBody
            });

            core.info(`Pull Request created: #${pr.data.number}`);

            core.setOutput("pr_number", pr.data.number.toString());


      # --------------------------------------------------------
      # Wait for PR to become mergeable
      # --------------------------------------------------------

      - name: Wait for Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (prs.data.length === 0) {
              core.setFailed("No open Pull Request found.");
              return;
            }

            const prNumber = prs.data[0].number;

            core.info(`Checking merge status of PR #${prNumber}`);

            let mergeable = null;

            for (let attempt = 1; attempt <= 10; attempt++) {

              const pr = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              });

              mergeable = pr.data.mergeable;
              const mergeableState = pr.data.mergeable_state;

              core.info(
                `Attempt ${attempt}: mergeable=${mergeable}, state=${mergeableState}`
              );

              if (mergeable === true) {
                core.info("Pull Request is mergeable.");
                return;
              }

              if (mergeable === false) {
                core.setFailed(
                  `Pull Request is not mergeable. State: ${mergeableState}`
                );
                return;
              }

              // GitHub may return null while calculating mergeability
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

            core.setFailed(
              "GitHub did not determine PR mergeability within the expected time."
            );


      # --------------------------------------------------------
      # Merge Pull Request
      # --------------------------------------------------------

      - name: Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}

          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (prs.data.length === 0) {
              core.setFailed("No open Pull Request found from feature to main.");
              return;
            }

            const prNumber = prs.data[0].number;

            core.info(`Attempting to merge Pull Request #${prNumber}`);

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: "merge",
              commit_title: "Merge feature into main",
              commit_message: "Automatically merged after successful Terraform CI."
            });

            if (!result.data.merged) {
              core.setFailed(
                `PR #${prNumber} was not merged. Message: ${result.data.message}`
              );
              return;
            }

            core.info(`Pull Request #${prNumber} merged successfully.`);
            core.info(`SHA: ${result.data.sha}`);


  # ==========================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================================

  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    needs:
      - merge-feature-to-main

    if: success()

    defaults:
      run:
        shell: cmd

    steps:

      # --------------------------------------------------------
      # Checkout MAIN
      # --------------------------------------------------------

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # --------------------------------------------------------
      # Verify Main Branch
      # --------------------------------------------------------

      - name: Verify Main Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      # --------------------------------------------------------
      # Terraform Version
      # --------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      # --------------------------------------------------------
      # Deployment Complete
      # --------------------------------------------------------

      - name: Deployment Complete
        run: |
          echo ==========================================
          echo Terraform CD Completed Successfully
          echo Feature -^> Main -^> Azure
          echo ==========================================