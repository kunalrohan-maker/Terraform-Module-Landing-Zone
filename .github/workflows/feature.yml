name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================

  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:

      # ----------------------------------------------------------
      # Checkout Feature Branch
      # ----------------------------------------------------------

      - name: Checkout Feature Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Terraform Version
      # Terraform is already installed on self-hosted runner
      # ----------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # Azure Login
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ----------------------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Format
      # ----------------------------------------------------------

      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Upload Terraform Plan
      # ----------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ============================================================
  # 2. CREATE PR + AUTOMATICALLY MERGE FEATURE -> MAIN
  # ============================================================

  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    needs:
      - terraform-ci

    if: success()

    defaults:
      run:
        shell: cmd

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Configure Git
      # ----------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------
      # Create Pull Request if one does not already exist
      # ----------------------------------------------------------

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for /f "delims=" %%i in ('gh pr list --base main --head feature --state open --json number --jq ".[0].number"') do set PR_NUMBER=%%i

          if "%PR_NUMBER%"=="" (
            echo No open PR found. Creating PR...

            gh pr create ^
              --base main ^
              --head feature ^
              --title "Feature to Main - Terraform CI Passed" ^
              --body "Terraform CI completed successfully. Automatically created by GitHub Actions."

          ) else (
            echo Existing PR found: #%PR_NUMBER%
          )

      # ----------------------------------------------------------
      # Merge Pull Request
      # ----------------------------------------------------------

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for /f "delims=" %%i in ('gh pr list --base main --head feature --state open --json number --jq ".[0].number"') do set PR_NUMBER=%%i

          if "%PR_NUMBER%"=="" (
            echo ERROR: Pull Request not found.
            exit /b 1
          )

          echo Merging Pull Request #%PR_NUMBER%

          gh pr merge %PR_NUMBER% ^
            --merge ^
            --delete-branch=false ^
            --subject "Merge feature into main" ^
            --body "Automatically merged after successful Terraform CI."

          if errorlevel 1 (
            echo ERROR: Pull Request merge failed.
            exit /b 1
          )

          echo Feature successfully merged into main.


  # ============================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ============================================================

  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    needs:
      - merge-feature-to-main

    if: success()

    defaults:
      run:
        shell: cmd

    steps:

      # ----------------------------------------------------------
      # Checkout MAIN after successful merge
      # ----------------------------------------------------------

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ----------------------------------------------------------
      # Verify branch
      # ----------------------------------------------------------

      - name: Verify Main Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      # ----------------------------------------------------------
      # Terraform Version
      # ----------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # Azure Login
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ----------------------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      # ----------------------------------------------------------
      # Deployment Complete
      # ----------------------------------------------------------

      - name: Deployment Complete
        run: |
          echo ==========================================
          echo Terraform CD Completed Successfully
          echo Feature -^> Main -^> Azure
          echo ==========================================