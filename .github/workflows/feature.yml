name: Terraform Feature Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Feature Pipeline
    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"

      # Terraform Version
      - name: Terraform Version
        run: terraform version

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Verify Azure Login
      - name: Verify Azure Login
        run: |
          az account show

      # Terraform Init
      - name: Terraform Init
        working-directory: Environment/prod
        run: |
          terraform init

      # Terraform Format
      - name: Terraform Format
        working-directory: Environment/prod
        run: |
          terraform fmt -recursive

      # Terraform Validate
      - name: Terraform Validate
        working-directory: Environment/prod
        run: |
          terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: Environment/prod
        run: |
          terraform plan -out=tfplan

      # Upload Terraform Plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan