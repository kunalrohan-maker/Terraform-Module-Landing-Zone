name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================

  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:

      # ----------------------------------------------------------
      # Checkout Feature Branch
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Terraform Version
      # ----------------------------------------------------------
      # Terraform is already installed on your self-hosted runner.
      # No setup-terraform action is used because the runner is
      # Windows ARM64.
      # ----------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # Azure Login
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ----------------------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Format
      # ----------------------------------------------------------

      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Upload Terraform Plan
      # ----------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ============================================================
  # 2. AUTOMATIC MERGE FEATURE -> MAIN
  # ============================================================

  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    needs:
      - terraform-ci

    if: success()

    steps:

      # ----------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Configure Git
      # ----------------------------------------------------------

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------
      # Fetch Latest Branches
      # ----------------------------------------------------------

      - name: Fetch Branches
        run: |
          git fetch origin main
          git fetch origin feature

      # ----------------------------------------------------------
      # Merge Feature into Main
      # ----------------------------------------------------------

      - name: Merge Feature into Main
        run: |
          git checkout main
          git reset --hard origin/main
          git merge origin/feature --no-ff -m "Merge feature into main"

      # ----------------------------------------------------------
      # Push Main
      # ----------------------------------------------------------

      - name: Push Main
        run: git push origin main


  # ============================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ============================================================

  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    needs:
      - merge-feature-to-main

    if: success()

    steps:

      # ----------------------------------------------------------
      # Checkout Main
      # ----------------------------------------------------------

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ----------------------------------------------------------
      # Terraform Version
      # ----------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # ----------------------------------------------------------
      # Azure Login
      # ----------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ----------------------------------------------------------
      # Verify Azure Login
      # ----------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------

      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      # ----------------------------------------------------------
      # Deployment Complete
      # ----------------------------------------------------------

      - name: Deployment Complete
        run: echo Terraform CD completed successfully.