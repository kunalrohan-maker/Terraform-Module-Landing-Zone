name: Terraform CI-CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================

  terraform-ci:

    name: Terraform CI

    # Self-hosted runner
    runs-on: self-hosted

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"


      # ------------------------------------------------------
      # Terraform Version
      # ------------------------------------------------------

      - name: Terraform Version
        run: |
          terraform version


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: |
          terraform init


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format
        working-directory: Environment/prod
        run: |
          terraform fmt -recursive


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: |
          terraform validate


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: |
          terraform plan -out=tfplan


      # ------------------------------------------------------
      # Upload Terraform Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ==========================================================
  # 2. PRODUCTION APPROVAL
  # ==========================================================

  production-approval:

    name: Production Approval

    needs: terraform-ci

    # Same self-hosted runner
    runs-on: self-hosted

    # IMPORTANT:
    # Configure this environment in:
    #
    # Repository
    #   → Settings
    #   → Environments
    #   → production
    #
    # Add your collaborator under:
    # Required reviewers

    environment:
      name: production

    steps:

      - name: Approval Received
        run: |
          echo "=========================================="
          echo "Production approval received."
          echo "CI completed successfully."
          echo "Starting Production CD."
          echo "=========================================="


  # ==========================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================================

  terraform-cd:

    name: Terraform CD - Production

    needs: production-approval

    # Self-hosted runner
    runs-on: self-hosted

    steps:

      # ------------------------------------------------------
      # Checkout Feature Branch
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"


      # ------------------------------------------------------
      # Terraform Version
      # ------------------------------------------------------

      - name: Terraform Version
        run: |
          terraform version


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: |
          terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: |
          terraform validate


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply
        working-directory: Environment/prod
        run: |
          terraform apply -auto-approve