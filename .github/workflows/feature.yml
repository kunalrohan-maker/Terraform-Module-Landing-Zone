name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================
  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:

      # Checkout feature branch
      - name: Checkout Feature Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Terraform is already installed on the self-hosted runner
      - name: Terraform Version
        run: terraform version

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Verify Azure Login
      - name: Verify Azure Login
        run: az account show

      # Terraform Init
      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # Terraform Format
      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      # Terraform Validate
      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # Upload Terraform Plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ==========================================================
  # 2. CREATE PR + AUTO MERGE FEATURE -> MAIN
  # ==========================================================
  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    needs:
      - terraform-ci

    if: success()

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Create Pull Request
      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner: owner,
              repo: repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (prs.data.length > 0) {
              core.info(`Existing PR found: #${prs.data[0].number}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner: owner,
              repo: repo,
              title: "Feature to Main - Terraform CI Passed",
              head: "feature",
              base: "main",
              body: `
## Terraform CI Passed

The Terraform CI pipeline completed successfully.

### Checks completed
- Terraform Init
- Terraform Format
- Terraform Validate
- Terraform Plan

This Pull Request was created automatically by GitHub Actions.
`
            });

            core.info(`Pull Request created: #${pr.data.number}`);


      # Merge Pull Request
      - name: Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const prs = await github.rest.pulls.list({
              owner: owner,
              repo: repo,
              head: `${owner}:feature`,
              base: "main",
              state: "open"
            });

            if (prs.data.length === 0) {
              core.setFailed("No open Pull Request found from feature to main.");
              return;
            }

            const prNumber = prs.data[0].number;

            core.info(`Merging Pull Request #${prNumber}`);

            const result = await github.rest.pulls.merge({
              owner: owner,
              repo: repo,
              pull_number: prNumber,
              merge_method: "merge",
              commit_title: "Merge feature into main",
              commit_message: "Automatically merged after successful Terraform CI."
            });

            if (!result.data.merged) {
              core.setFailed(
                `Pull Request #${prNumber} was not merged. Message: ${result.data.message}`
              );
              return;
            }

            core.info(`Pull Request #${prNumber} merged successfully.`);


  # ==========================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================================
  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    needs:
      - merge-feature-to-main

    if: success()

    defaults:
      run:
        shell: cmd

    steps:

      # Checkout main after successful merge
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Confirm we're deploying main
      - name: Verify Main Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      # Terraform Version
      - name: Terraform Version
        run: terraform version

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Verify Azure Login
      - name: Verify Azure Login
        run: az account show

      # Terraform Init
      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # Terraform Apply
      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      # Deployment complete
      - name: Deployment Complete
        run: |
          echo ==========================================
          echo Terraform CD Completed Successfully
          echo Feature -^> Main -^> Azure
          echo ==========================================