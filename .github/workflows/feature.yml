name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ==========================================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================================

  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:

      - name: Checkout Feature Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Terraform Version
        run: terraform version

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: az account show

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ==========================================================
  # 2. CREATE PR + AUTO MERGE FEATURE -> MAIN
  # ==========================================================

  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    needs: terraform-ci

    if: success()

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Create Pull Request
      # -------------------------------------------------------

      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if an open PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: 'main',
              state: 'open'
            });

            let prNumber;

            if (existingPRs.data.length > 0) {

              prNumber = existingPRs.data[0].number;

              core.info(`Existing PR found: #${prNumber}`);

            } else {

              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: 'Feature to Main - Terraform CI Passed',
                head: 'feature',
                base: 'main',
                body: [
                  '## Terraform CI Passed',
                  '',
                  'The Terraform CI pipeline completed successfully.',
                  '',
                  '- Terraform Init',
                  '- Terraform Format',
                  '- Terraform Validate',
                  '- Terraform Plan',
                  '',
                  'This PR was created automatically by GitHub Actions.'
                ].join('\n')
              });

              prNumber = pr.data.number;

              core.info(`Created PR #${prNumber}`);
            }

            core.setOutput('pr_number', prNumber.toString());


      # -------------------------------------------------------
      # Merge Pull Request
      # -------------------------------------------------------

      - name: Merge Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Find the open PR
            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:feature`,
              base: 'main',
              state: 'open'
            });

            if (prs.data.length === 0) {
              core.setFailed('No open Pull Request found from feature to main.');
              return;
            }

            const prNumber = prs.data[0].number;

            core.info(`Merging PR #${prNumber}`);

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: prNumber,
              merge_method: 'merge',
              commit_title: 'Merge feature into main',
              commit_message: 'Automatically merged after successful Terraform CI.'
            });

            if (!result.data.merged) {
              core.setFailed(
                `PR #${prNumber} was not merged. Message: ${result.data.message}`
              );
            } else {
              core.info(`PR #${prNumber} merged successfully.`);
            }


  # ==========================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ==========================================================

  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    needs: merge-feature-to-main

    if: success()

    defaults:
      run:
        shell: cmd

    steps:

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Main Branch
        run: |
          git branch --show-current
          git log -1 --oneline

      - name: Terraform Version
        run: terraform version

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: az account show

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      - name: Deployment Complete
        run: |
          echo ==========================================
          echo Terraform CD Completed Successfully
          echo Feature -^> Main -^> Azure
          echo ==========================================