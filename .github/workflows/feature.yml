name: Terraform CI CD Pipeline

on:
  push:
    branches:
      - feature

permissions:
  contents: write
  pull-requests: write

jobs:

  # ============================================================
  # 1. CONTINUOUS INTEGRATION
  # ============================================================

  terraform-ci:
    name: Terraform CI
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:

      # Checkout feature branch
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Terraform is already installed on self-hosted runner
      - name: Terraform Version
        run: terraform version

      # Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Verify Azure Login
      - name: Verify Azure Login
        run: az account show

      # Terraform Init
      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # Terraform Format
      - name: Terraform Format
        working-directory: Environment/prod
        run: terraform fmt -recursive

      # Terraform Validate
      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # Upload plan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Environment/prod/tfplan


  # ============================================================
  # 2. CREATE PR AND MERGE FEATURE -> MAIN
  # ============================================================

  merge-feature-to-main:
    name: Merge Feature to Main
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    needs:
      - terraform-ci

    if: success()

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Create Pull Request
      # --------------------------------------------------------

      - name: Create Pull Request
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prNumber = gh pr list `
            --base main `
            --head feature `
            --state open `
            --json number `
            --jq '.[0].number'

          if ([string]::IsNullOrWhiteSpace($prNumber)) {

            Write-Host "Creating Pull Request..."

            gh pr create `
              --base main `
              --head feature `
              --title "Feature to Main - Terraform CI Passed" `
              --body "Terraform CI completed successfully. Automatically created by GitHub Actions."

          }
          else {

            Write-Host "Pull Request already exists: #$prNumber"

          }

      # --------------------------------------------------------
      # Merge Pull Request
      # --------------------------------------------------------

      - name: Merge Pull Request
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          $prNumber = gh pr list `
            --base main `
            --head feature `
            --state open `
            --json number `
            --jq '.[0].number'

          if ([string]::IsNullOrWhiteSpace($prNumber)) {

            Write-Error "Pull Request was not found."

          }

          Write-Host "Merging Pull Request #$prNumber"

          gh pr merge $prNumber `
            --merge `
            --delete-branch=false

          Write-Host "Feature branch merged into main successfully."


  # ============================================================
  # 3. CONTINUOUS DEPLOYMENT
  # ============================================================

  terraform-cd:
    name: Terraform CD
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    needs:
      - merge-feature-to-main

    if: success()

    steps:

      # --------------------------------------------------------
      # Checkout MAIN after successful merge
      # --------------------------------------------------------

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # --------------------------------------------------------
      # Verify Terraform
      # --------------------------------------------------------

      - name: Terraform Version
        run: terraform version

      # --------------------------------------------------------
      # Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: Environment/prod
        run: terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: Environment/prod
        run: terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: Environment/prod
        run: terraform plan -out=tfplan

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: Environment/prod
        run: terraform apply -auto-approve tfplan

      # --------------------------------------------------------
      # Deployment Complete
      # --------------------------------------------------------

      - name: Deployment Complete
        run: echo Terraform CD completed successfully.